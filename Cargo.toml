[package]
name = "ro_launcher"
version = "0.1.0"
edition = "2021"
description = "Consolidated single-console launcher for the RO_PreRenewal stack (Laragon + rAthena servers + Ragnarok client)"

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sysinfo = "0.39"
ctrlc = "3"
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Security",
] }